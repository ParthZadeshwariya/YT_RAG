<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT RAG Assistant</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Marked.js for Markdown Rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>

<body>

    <!-- Background Elements -->
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>

    <!-- Main Container -->
    <div class="app-container">

        <!-- Header -->
        <header>
            <div class="logo">
                <i class="fa-brands fa-youtube"></i>
                <span>YT RAG Assistant</span>
            </div>
            <button id="reset-btn" class="icon-btn" title="New Session">
                <i class="fa-solid fa-arrows-rotate"></i>
            </button>
        </header>

        <!-- Chat Area -->
        <main id="chat-container">
            <div class="welcome-message">
                <h2>Video Knowledge Base</h2>
                <p>Enter a YouTube URL to start chatting with the video content.</p>
            </div>
            <!-- Messages will be injected here -->
        </main>

        <!-- Input Area -->
        <div class="input-area">
            <div class="input-wrapper">
                <input type="text" id="user-input" placeholder="Ask a question about the video..." autocomplete="off"
                    disabled>
                <button id="send-btn" disabled>
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>

    </div>

    <!-- Modal for URL Input -->
    <div id="url-modal" class="modal">
        <div class="modal-content">
            <h3>Start New Session</h3>
            <p>Paste a YouTube video URL to analyze.</p>

            <div class="url-input-group">
                <i class="fa-brands fa-youtube input-icon"></i>
                <input type="text" id="url-input" placeholder="https://www.youtube.com/watch?v=...">
            </div>

            <button id="init-btn" class="primary-btn">
                <span>Analyze Video</span>
                <div class="spinner hidden" id="init-spinner"></div>
            </button>

            <p id="error-msg" class="error-text hidden"></p>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>

</html>
